# Experiment: CIFAR-100 and 20 Newsgroups Multi-Task Training
# This is the final, corrected version.

project_name: "Synapse_CIFAR100_20News_v1"
seed: 42

# --- Data Parameters ---
data:
  cifar100_path: "./datasets/cifar100"
  20news_path: "./datasets/20news"
  num_workers: 8

# --- Training Parameters ---
training:
  device: "cuda"
  epochs: 100
  batch_size: 128
  optimizer: "AdamW"
  learning_rate: 0.0003
  weight_decay: 0.05

# --- Model Parameters ---
model:
  substrate:
    hidden_dims: [512, 256]

  weaver:
    task_embedding_dim: 32
    context_dim: 32  # <-- THIS LINE IS THE FIX (was 'context_embedding_dim')
    hidden_dim: 512
    num_hidden_layers: 4

  ledger:
    capacity: 2048
